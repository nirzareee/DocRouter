name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the benchmark end to end
        run: |
          python scripts/make_samples.py
          python -m docrouter.cli bench data/sample_corpus --no-cache

      - name: Verify metrics still discriminate
        # A benchmark whose metrics stop separating the strawman from the real
        # backend is broken even if every unit test passes. This asserts the
        # headline property directly.
        run: |
          python - <<'PY'
          import json, subprocess, sys

          subprocess.run(
              ["python", "-m", "docrouter.cli", "bench", "data/sample_corpus",
               "--out", "results/ci.jsonl", "--no-cache", "--quiet"],
              check=True,
          )
          rows = [json.loads(l) for l in open("results/ci.jsonl")]
          by = {r["backend"]: r for r in rows if r["doc_id"] == "0001_table"}

          assert by["pylib"]["teds"] > 0.9, by["pylib"]["teds"]
          assert by["naive"]["teds"] == 0.0, by["naive"]["teds"]

          two = {r["backend"]: r for r in rows if r["doc_id"] == "0002_twocol"}
          assert two["pylib"]["reading_order"] > two["naive"]["reading_order"]
          print("metric discrimination holds")
          PY
